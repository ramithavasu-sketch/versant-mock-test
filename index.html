<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{

  --ok:#2F7D4F; --okbg:#E6F3EB; --bad:#B33A3A; --badbg:#F8E7E7; --mark:#F2D45C; --accent:#2C5282; --onaccent:#FFFFFF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A23; --sheet:#1A2430; --ink:#E4EAF1; --muted:#9AA6B3; --line:#33414F; --soft:#202C39;
    --ok:#6CC08F; --okbg:#1D3327; --bad:#E58080; --badbg:#3A2224; --mark:#C9A93A; --accent:#8DB4E8; --onaccent:#0E1620; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A23; --sheet:#1A2430; --ink:#E4EAF1; --muted:#9AA6B3; --line:#33414F; --soft:#202C39;
  --ok:#6CC08F; --okbg:#1D3327; --bad:#E58080; --badbg:#3A2224; --mark:#C9A93A; --accent:#8DB4E8; --onaccent:#0E1620; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.bar{max-width:820px;margin:0 auto;padding:12px 20px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:1.3rem;margin:0}
.speed{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:thin}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 12px;white-space:nowrap;color:var(--muted);font-weight:500}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button,select,textarea,input{font:inherit;color:var(--ink)}
button,select{font-size:.875rem;border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:6px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:600}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:820px;margin:0 auto;padding:18px 20px 70px}
h2{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:1.45rem;margin:0 0 4px}
h3{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:1.1rem;margin:0 0 6px}
.tip{color:var(--muted);margin:0 0 12px;max-width:68ch}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:.9rem;align-items:baseline}
.stats b{font-size:1.1rem}.stats .ok b{color:var(--ok)}.stats .bad b{color:var(--bad)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 12px;display:flex}
.progress span{display:block;height:100%}.p-ok{background:var(--ok)}.p-bad{background:var(--bad)}
.tools,.btns,.nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:14px 0}
.cardtop{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-bottom:12px}
.badge{border-radius:5px;padding:1px 8px;font-weight:600}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.bad{background:var(--badbg);color:var(--bad)}
.hint{color:var(--muted);font-size:.9rem;margin:0 0 12px}
.serif{font-family:"Source Serif 4",Georgia,serif;font-size:1.12rem;line-height:1.8}
.hidden{display:none}
.out{margin-top:12px}
.fb{border-radius:6px;padding:8px 12px;margin-top:12px}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}
.fb .ans{color:var(--ink);display:block;margin-top:4px}
.w.miss{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px;font-weight:600}
.w.extra{color:var(--muted);text-decoration:line-through}
.legend{font-size:.8rem;color:var(--muted);margin-top:6px}
.blank{font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:1rem;background:transparent;border:0;border-bottom:2px solid var(--muted);border-radius:0;width:9.5em;max-width:100%;padding:0 4px 1px;margin:0 2px}
.blank:focus{outline:none;background:color-mix(in srgb,var(--mark) 30%,transparent)}
.textin{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 11px;background:var(--soft);font-size:1rem;margin-top:10px}
textarea.textin{min-height:150px;resize:vertical;line-height:1.6}
.line{min-height:52px;border:2px dashed var(--line);border-radius:8px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.line:empty::before{content:"Tap the phrases below in order";color:var(--muted);font-size:.9rem;align-self:center}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.tile{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:6px 14px;font-size:.95rem}
.line .tile{background:color-mix(in srgb,var(--accent) 14%,var(--sheet));border-color:var(--accent)}
.conv p{margin:4px 0}.conv .who{color:var(--muted);font-size:.8rem;margin-right:6px}
.passage{background:var(--soft);border-left:3px solid var(--accent);padding:12px 16px;border-radius:0 8px 8px 0;margin:10px 0}
.timer{font-variant-numeric:tabular-nums;font-weight:600;margin:8px 0;color:var(--accent)}
.compare{display:grid;gap:12px;margin-top:12px}
.compare div{background:var(--soft);border-radius:8px;padding:10px 14px}
.compare small{display:block;color:var(--muted);font-weight:600;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:14px}
.tilecard{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.tilecard .skill{color:var(--muted);font-size:.8rem}
.tilecard p{margin:0;font-size:.9rem;color:var(--muted);flex:1}
.mini{height:5px;background:var(--line);border-radius:3px;overflow:hidden;display:flex}
.note{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-top:16px;font-size:.92rem}
.note ul{margin:6px 0 0;padding-left:20px}
.key h3{margin-top:26px}
.key ol{padding-left:2.4em;margin:6px 0}
.key li{margin:4px 0;line-height:1.55}
.key .a{color:var(--ok);font-weight:600}
.key .sub{color:var(--muted);font-size:.88rem}
.empty{padding:24px;text-align:center;color:var(--muted)}
@media (max-width:560px){.card{padding:14px}.serif{font-size:1.02rem}}
@media print{header,.noprint{display:none!important}body{background:#fff;color:#000}main{padding:0}}
/* ---------- mock test ---------- */
.intest nav{display:none}
.mk-cta{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--sheet);border:1px solid var(--accent);border-radius:10px;padding:14px 18px;margin-bottom:18px}
.mk-cta span{color:var(--muted);font-size:.92rem}
.mk-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:12px 0}
.mk-opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--sheet);cursor:pointer}
.mk-opt:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--sheet))}
.mk-opt input{margin-top:4px;accent-color:var(--accent)}
.mk-opt small{display:block;color:var(--muted)}
.mk-table{width:100%;border-collapse:collapse;font-size:.92rem;margin:8px 0}
.mk-table th,.mk-table td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.mk-table th{color:var(--muted);font-weight:500;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.mk-table td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.tblwrap{overflow-x:auto}
.mk-mic{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}
.mk-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.mk-part{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.mk-stage{min-height:230px;display:flex;flex-direction:column;gap:12px}
.mk-status{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.05rem}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line);flex:none}
.dot.listen{background:var(--accent);animation:pulse 1.2s infinite}
.dot.speak{background:var(--bad);animation:pulse .9s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
@media (prefers-reduced-motion:reduce){.dot.listen,.dot.speak{animation:none}}
.cd{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.cd span{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.cdtxt{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted)}
.heard{color:var(--muted);font-size:.9rem;font-style:italic;min-height:1.4em}
.mk-overall{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.mk-big{font-family:"Source Serif 4",Georgia,serif;font-size:4rem;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.mk-big small{font-size:1rem;color:var(--muted);font-weight:400}
.mk-cefr{font-size:1.1rem;font-weight:600;color:var(--accent)}
.skill{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;margin:12px 0}
.skill .nm{font-weight:600}
.skill .sc{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.track{position:relative;height:12px;background:var(--soft);border:1px solid var(--line);border-radius:6px}
.track .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:6px}
.track .tk{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--muted);opacity:.5}
.bands{position:relative;height:16px;font-size:.7rem;color:var(--muted);margin-left:120px;margin-right:54px}
.bands span{position:absolute;transform:translateX(-50%)}
.mk-traits{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.mk-traits div{background:var(--soft);border-radius:8px;padding:8px 12px;font-size:.88rem}
.mk-traits b{font-variant-numeric:tabular-nums}
details.rev{border-top:1px solid var(--line);padding:8px 0}
details.rev summary{cursor:pointer;font-weight:600}
.ritem{padding:8px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.ritem:last-child{border-bottom:0}
.ritem .q{color:var(--muted)}
.ritem .you{display:block}
.hist button{width:100%;text-align:left;display:flex;justify-content:space-between;gap:10px;margin:6px 0}
@media (max-width:560px){.mk-overall{grid-template-columns:1fr}.skill{grid-template-columns:84px 1fr 38px}.bands{margin-left:94px;margin-right:48px}.mk-big{font-size:3.2rem}}
</style>
</head>

</header>

{t:"Trade fair in Rome",p:"I was at the International Trade Fair in Rome last week, and it was very exciting. Rome is a beautiful city. There were people from all over the world at the fair. I met a sales manager whose company sells software and it sounded like there might be a business opportunity. I’ll definitely stay in touch with him as a business contact. I’m writing a report of the trip right now and I should be able to send it out by noon today.",m:"I attended the International Trade Fair in Rome last week, and it was very exciting. Rome is a beautiful city, and there were people from all over the world at the fair. I met a sales manager from a software company, and there might be a business opportunity. I will stay in touch with him as a business contact. I am writing a report on the trip now and should be able to send it out by noon today."},

{t:"Gym discount for employees",p:"Our gym is located across from your office and is currently offering a special discount to all employees working in your office. According to researchers, getting exercise regularly is a great way to stay positive and healthy. If you sign up for a membership this week, you can get a personal trainer to help you on your first five visits.",m:"Our gym, located across from your office, is currently offering a special discount to all employees in your office. Researchers say that regular exercise is a great way to stay positive and healthy. If you sign up for a membership this week, you will get a personal trainer to help you on your first five visits."},
{t:"Hospital annual reminder",p:"This is our annual reminder to all employees. Our hospital is known in our community for excellent customer care. We have been providing friendly and quality services to all our patients and are committed to doing the same again this year. Greet your patients with a smile and hospitality.",m:"This is our annual reminder to all employees. Our hospital is known in the community for excellent customer care. We have always provided friendly, quality service to all our patients, and we are committed to doing the same this year. Please greet your patients with a smile and hospitality."},
{t:"James – retirement",p:"After working for thirty years as a salesperson, James decided to retire. The first few weeks of his retired life were fine. He relaxed and spent a lot of time reading. After a month, he started to get bored. He decided to volunteer at the local animal rescue center. He loved working with the animals, and was glad to have a scheduled activity to do each day.",m:"After thirty years as a salesperson, James decided to retire. The first few weeks were fine; he relaxed and read a lot. After a month, however, he started to get bored, so he decided to volunteer at the local animal rescue center. He loved working with the animals and was glad to have a scheduled activity every day."},
{t:"Certificate program",p:"Thank you for your interest in our certificate program. The program is specifically designed for people with a full-time job. All our classes are offered at night and on weekends. Not only can our program offer you the knowledge you need in your field, it will also give you the opportunity to meet with people working in the same industry as you are. Don’t hesitate to contact me if you have any questions.",m:"Thank you for your interest in our certificate program. It is designed for people with full-time jobs, so all classes are held at night and on weekends. The program gives you the knowledge you need in your field and also the chance to meet people working in the same industry. Please feel free to contact me if you have any questions."},

{t:"Anna – dry cleaning",p:"Anna picked up her suit from the dry cleaners. After she had paid, she noticed that the cleaners had not cleaned the suit properly. She politely brought this to their attention, and requested a refund. Although the cleaner apologized, he said that it was not his fault, and refused to give Anna a refund.",m:"Anna picked up her suit from the dry cleaners. After paying, she noticed that it had not been cleaned properly. She politely pointed this out and asked for a refund. The cleaner apologized but said it was not his fault and refused to give her a refund."},

{t:"John – new phone",p:"John bought a new phone and was looking forward to trying it out as soon as possible. The moment John got home, he tried to turn it on, but it didn’t work. He immediately drove back to the store. The salesperson was very nice and showed John how to insert the battery. John was pleased that the phone was working properly, but at the same time, he felt embarrassed because he should have read the instructions.",m:"John bought a new phone and was eager to try it. As soon as he got home, he tried to turn it on, but it did not work. He drove straight back to the store, where the salesperson kindly showed him how to insert the battery. John was pleased that the phone worked, but he felt embarrassed because he should have read the instructions."},
{t:"Anna – surprise party",p:"Anna was organizing a birthday party for her coworker, Susan. Anna wanted it to be a surprise party, so she asked everyone in the office not to tell Susan about the party. Then, Anna asked the president of the company to send out an email inviting everyone to a company meeting. Susan walked into the conference room expecting a meeting, but instead, everyone shouted, “Happy Birthday!”",m:"Anna was organizing a surprise birthday party for her coworker, Susan, so she asked everyone in the office not to tell her. Then Anna asked the company president to send an email inviting everyone to a meeting. When Susan walked into the conference room expecting a meeting, everyone shouted, “Happy Birthday!”"},

{t:"James – apartment search",p:"James was moving to Chicago and needed an apartment. First, he searched the internet, but there were so many apartment listings that he didn’t know where to begin. Then he searched the local newspaper, but the listings did not provide him with enough information. Finally, he went to a real estate agent in Chicago, who found him a suitable apartment near his new job.",m:"James was moving to Chicago and needed an apartment. He first searched the internet, but there were so many listings that he did not know where to start. Then he tried the local newspaper, but the listings did not give enough information. Finally, he went to a real estate agent in Chicago, who found him a suitable apartment near his new job."},
{t:"Derek – going-away party",p:"Derek wanted to throw a going-away party for his daughter. She was going away to college in a week. Derek decided to have an outdoor party in the garden behind his house. Unfortunately, it rained the day of the party. Even though everyone had to stay inside the house, they all had a wonderful time.",m:"Derek wanted to have a going-away party for his daughter, who was leaving for college in a week. He planned an outdoor party in the garden behind his house. Unfortunately, it rained on the day of the party. Although everyone had to stay inside, they all had a wonderful time."},

/* ---------- storage ---------- */
const KEY="versant-practice-all-v1";
let ST={}; try{ST=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){ST={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}};
function S(sec){ let s=ST[sec.id]; if(!s||!s.order||s.order.length!==sec.items.length){ s=ST[sec.id]={order:sec.items.map((_,i)=>i),pos:0,res:{},ans:{},wrongOnly:false}; } return s; }

/* ---------- text helpers ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const UK={favourite:"favorite",neighbour:"neighbor",neighbours:"neighbors",centre:"center",cancelled:"canceled",travelling:"traveling",organised:"organized",colour:"color",tyre:"tire",programme:"program",practising:"practicing",analyse:"analyze",dialled:"dialed"};
const words=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’‘`]/g,"'").replace(/[^a-z0-9' ]+/g," ").split(/\s+/).map(w=>w.replace(/^'+|'+$/g,"")).filter(Boolean).map(w=>UK[w]||w);
const same=(a,b)=>words(a).join(" ")===words(b).join(" ");
function diff(exp,got){
  const n=exp.length,m=got.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=exp[i]===got[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[];let i=0,j=0;
  while(i<n&&j<m){ if(exp[i]===got[j]){out.push(["same",exp[i]]);i++;j++;} else if(dp[i+1][j]>=dp[i][j+1]){out.push(["miss",exp[i]]);i++;} else {out.push(["extra",got[j]]);j++;} }
  while(i<n)out.push(["miss",exp[i++]]); while(j<m)out.push(["extra",got[j++]]);
  return out;
}
const diffHTML=d=>d.map(([k,w])=>`<span class="w ${k}">${esc(w)}</span>`).join(" ");
const LEGEND=`<div class="legend">Underlined in red: words you missed or got wrong. Struck through: words that should not be there.</div>`;

/* ---------- speech ---------- */
const hasTTS="speechSynthesis" in window;
let voices=[];
const voiceSel=document.getElementById("voice"), rateSel=document.getElementById("rate");
const VKEY="versant-voice", RKEY="versant-rate";
try{ const r=localStorage.getItem(RKEY); if(r) rateSel.value=r; }catch(e){}
rateSel.onchange=()=>{ try{localStorage.setItem(RKEY,rateSel.value)}catch(e){} };
function vscore(v){ const n=v.name; let s=0;
  if(/natural|neural|online/i.test(n))s+=50; if(/google/i.test(n))s+=30; if(/premium|enhanced/i.test(n))s+=25;
  if(/aria|jenny|guy|ava|andrew|emma|brian|samantha|allison|daniel|serena|libby|sonia|neerja/i.test(n))s+=10;
  if(/en[-_]US/i.test(v.lang))s+=5; else if(/en[-_](GB|IN|AU)/i.test(v.lang))s+=3;
  if(/compact|espeak|zira|david|hazel|novelty|bad news|bells|bubbles|cellos|jester|organ|trinoids|whisper|zarvox|albert|fred|junior|ralph|kathy|bahh|boing|wobble|superstar|grandpa|grandma|eddy|flo|reed|rocko|sandy|shelley/i.test(n))s-=40;
  return s; }
function loadVoices(){
  if(!hasTTS)return;
  voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>vscore(b)-vscore(a));
  let saved=null; try{saved=localStorage.getItem(VKEY)}catch(e){}
  voiceSel.innerHTML=voices.length?voices.map((v,i)=>`<option value="${i}">${esc(v.name)} (${esc(v.lang)})</option>`).join(""):'<option value="0">Default voice</option>';
  const si=voices.findIndex(v=>v.name===saved); voiceSel.value=String(si>=0?si:0);
}
if(hasTTS){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; } else { document.getElementById("voiceWrap").style.display="none"; document.getElementById("testVoice").style.display="none"; }
voiceSel.onchange=()=>{ const v=voices[+voiceSel.value]; try{ v&&localStorage.setItem(VKEY,v.name) }catch(e){} speak([{t:"This is how the questions will sound."}]); };
document.getElementById("testVoice").onclick=()=>speak([{t:"Please put that letter back on my desk."}]);
function voiceFor(n){ if(!voices.length)return null; const main=voices[+voiceSel.value||0]; if(!n)return main; const alt=voices.find(v=>v.name!==main.name&&vscore(v)>=vscore(main)-20); return alt||main; }
let speakTimer=null;
function speak(parts){
  if(!hasTTS)return false;
  speechSynthesis.cancel(); clearTimeout(speakTimer);
  let k=0;
  const next=()=>{ if(k>=parts.length)return; const p=parts[k++]; const u=new SpeechSynthesisUtterance(p.t); const v=voiceFor(p.v||0); if(v){u.voice=v;u.lang=v.lang}else u.lang="en-US"; u.rate=parseFloat(rateSel.value); u.pitch=1; u.volume=1; u.onend=()=>{ speakTimer=setTimeout(next,p.gap||700) }; speechSynthesis.speak(u); };
  speakTimer=setTimeout(next,80);
  return true;
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const NOAUDIO=`<p class="hint">Your browser can’t play audio here, so the text is shown instead. Read it once, cover it, and answer from memory.</p>`;

/* ---------- section renderers ---------- */
const R={};

R.repeat=(i,el,api)=>{
  const txt=REPEAT[i];
  el.innerHTML=`${hasTTS?"":NOAUDIO}
  <div class="btns"><button class="primary" data-k="play">Play sentence</button>${SR?'<button data-k="rec">Speak and check</button>':""}<button data-k="show">Show sentence</button></div>
  <p class="serif ${hasTTS&&!api.res?"hidden":""}" data-k="txt">${esc(txt)}</p>
  <div class="out" data-k="out"></div>
  <div class="btns" style="margin-top:12px"><span class="hint" style="margin:0">Mark yourself:</span><button data-k="ok">I said it correctly</button><button data-k="bad">I missed some words</button></div>`;
  const q=k=>el.querySelector(`[data-k="${k}"]`);
  q("play").onclick=()=>speak([{t:txt}]);
  q("show").onclick=()=>q("txt").classList.remove("hidden");
  q("ok").onclick=()=>{q("txt").classList.remove("hidden");api.mark("ok")};
  q("bad").onclick=()=>{q("txt").classList.remove("hidden");api.mark("bad")};
  if(SR) q("rec").onclick=()=>{
    let r; try{ r=new SR(); }catch(e){ q("out").innerHTML=`<div class="fb bad">The microphone can’t start here. Say the sentence aloud, then use Show sentence and mark yourself.</div>`; return; }
    r.lang="en-US"; r.interimResults=false; r.maxAlternatives=1;
    q("out").innerHTML=`<p class="hint">Listening… say the sentence now.</p>`;
    r.onresult=e=>{
      const said=e.results[0][0].transcript, d=diff(words(txt),words(said));
      const hit=d.filter(x=>x[0]==="same").length, acc=hit/words(txt).length;
      q("txt").classList.remove("hidden");
      const ok=acc>=0.9;
      q("out").innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?"Well repeated":"Some words were missed"} (${Math.round(acc*100)}% of words matched)<span class="ans">You said: ${esc(said)}</span></div><p class="serif">${diffHTML(d)}</p>${LEGEND}`;
      api.mark(ok?"ok":"bad");
    };
    r.onerror=e=>{ q("out").innerHTML=`<div class="fb bad">The microphone isn’t available (${esc(e.error)}). Say the sentence aloud, then use Show sentence and mark yourself.</div>`; };
    try{ r.start(); }catch(e){ r.onerror({error:"blocked"}); }
  };
};

R.builds=(i,el,api)=>{
  const [chunks,answers]=BUILDS[i];
  let picked=Array.isArray(api.ans)?api.ans.slice():[];
  el.innerHTML=`${hasTTS?"":NOAUDIO}
  <div class="btns"><button class="primary" data-k="play">Play phrases</button></div>
  <div class="line" data-k="line" aria-label="Your sentence"></div>
  <div class="pool" data-k="pool"></div>
  <div class="btns" style="margin-top:14px"><button class="primary" data-k="check">Check</button><button data-k="clear">Clear</button><button data-k="show">Show answer</button></div>
  <div data-k="out"></div>`;
  const q=k=>el.querySelector(`[data-k="${k}"]`);
  q("play").onclick=()=>speak(chunks.map(t=>({t})));
  function draw(){
    q("line").innerHTML=""; q("pool").innerHTML="";
    picked.forEach((c,pi)=>{ const b=document.createElement("button"); b.className="tile"; b.textContent=chunks[c]; b.onclick=()=>{picked.splice(pi,1);draw()}; q("line").append(b); });
    chunks.forEach((t,c)=>{ if(picked.includes(c))return; const b=document.createElement("button"); b.className="tile"; b.textContent=t; b.onclick=()=>{picked.push(c);draw()}; q("pool").append(b); });
    q("check").disabled=picked.length!==chunks.length;
  }
  draw();
  const show=(ok)=>{ q("out").innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?"Correct":"Not quite"}<span class="ans">${esc(answers[0])}${answers.length>1?" (also correct: "+answers.slice(1).map(esc).join(" / ")+")":""}</span></div>`; };
  q("check").onclick=()=>{ const ok=answers.some(a=>same(a,picked.map(c=>chunks[c]).join(" "))); api.mark(ok?"ok":"bad",picked); show(ok); };
  q("clear").onclick=()=>{picked=[];draw();q("out").innerHTML=""};
  q("show").onclick=()=>{ q("out").innerHTML=`<div class="fb bad">Answer<span class="ans">${esc(answers.join(" / "))}</span></div>`; if(!api.res)api.mark("bad",picked); };
  if(api.res) show(api.res==="ok");
};

R.dict=(i,el,api)=>{
  const txt=DICT[i];

const STOP=new Set("a an the and or but so to of in on at for from by with as is was were be been being are am do does did have has had he she it they we you i his her its their our your my me him them us this that these those there then than when while if not no very just all any some up out into about after before over also can could would should will shall may might must what which who whom how why where one two".split(" "));
let timer=null; const stopTimer=()=>{ if(timer){clearInterval(timer);timer=null} };
R.pass=(i,el,api)=>{
  const p=PASS[i];
  const keyWords=[...new Set(words(p.p).filter(w=>!STOP.has(w)&&w.length>2))];
  el.innerHTML=`<h3>${esc(p.t)}</h3>
  <div data-k="read"><button class="primary" data-k="start">Start reading (30 seconds)</button></div>
  <div class="hidden" data-k="phase1"><div class="timer" data-k="t1"></div><div class="passage serif">${esc(p.p)}</div><button data-k="ready">I’m ready to write</button></div>
  <div class="hidden" data-k="phase2"><div class="timer" data-k="t2"></div><textarea class="textin" data-k="in" placeholder="Rewrite the passage from memory">${esc(api.ans||"")}</textarea>
  <div class="btns" style="margin-top:10px"><button class="primary" data-k="check">Check my writing</button></div></div>
  <div data-k="out"></div>`;
  const q=k=>el.querySelector(`[data-k="${k}"]`);
  const count=(node,sec,label,done)=>{ stopTimer(); let t=sec; const tick=()=>{ node.textContent=t>0?`${label}: ${t} s`:`${label}: time’s up`; if(t<=0){stopTimer(); done&&done();} t--; }; tick(); timer=setInterval(tick,1000); };
  const write=()=>{ q("phase1").classList.add("hidden"); q("phase2").classList.remove("hidden"); q("in").focus(); count(q("t2"),90,"Writing time",null); };
  q("start").onclick=()=>{ q("read").classList.add("hidden"); q("phase1").classList.remove("hidden"); count(q("t1"),30,"Reading time",write); };
  q("ready").onclick=write;
  const show=()=>{ const uw=words(q("in").value);
    const hit=w=>uw.some(u=>u===w||(u.length>=5&&w.length>=5&&u.slice(0,5)===w.slice(0,5)));
    const missed=keyWords.filter(w=>!hit(w)), cov=(keyWords.length-missed.length)/keyWords.length, ok=cov>=0.65;
    q("out").innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?"Good recall":"Some key ideas are missing"}: you used ${Math.round(cov*100)}% of the key words from the passage. Aim for 65% or more, in correct sentences.</div>
    ${missed.length?`<p class="hint" style="margin-top:10px">Key words you left out: <span class="w miss">${missed.map(esc).join("</span>, <span class=\"w miss\">")}</span></p>`:""}
    <div class="compare"><div><small>Your answer</small>${esc(q("in").value)}</div><div><small>Model answer</small>${esc(p.m)}</div><div><small>Original passage</small>${esc(p.p)}</div></div>`;
    return ok; };
  q("check").onclick=()=>{ if(!words(q("in").value).length)return; stopTimer(); const ok=show(); api.mark(ok?"ok":"bad",q("in").value); };
  if(api.res){ q("read").classList.add("hidden"); q("phase2").classList.remove("hidden"); show(); }
};

/* ---------- views ---------- */
const main=document.getElementById("main"), tabs=document.getElementById("tabs");
let current="overview";
const TABS=[{id:"overview",name:"Overview"},{id:"mock",name:"Mock test"},...SECS,{id:"key",name:"Answer key"}];
function drawTabs(){ tabs.innerHTML=""; TABS.forEach(t=>{ const b=document.createElement("button"); b.role="tab"; b.textContent=t.name; b.setAttribute("aria-selected",t.id===current); b.onclick=()=>go(t.id); tabs.append(b); }); }
function go(id){ if(window.mockAbort)mockAbort(); current=id; stopTimer(); if(hasTTS)speechSynthesis.cancel(); drawTabs(); render(); window.scrollTo(0,0); const sel=tabs.querySelector('[aria-selected="true"]'); sel&&sel.scrollIntoView&&sel.scrollIntoView({block:"nearest",inline:"center"}); }

function counts(sec){ const s=S(sec); const v=Object.values(s.res); const ok=v.filter(x=>x==="ok").length, bad=v.filter(x=>x==="bad").length; return {ok,bad,left:sec.items.length-ok-bad,total:sec.items.length}; }

function render(){
  if(current==="overview") return renderOverview();
  if(current==="key") return renderKey();
  if(current==="mock") return renderMock();
  renderSection(SECS.find(s=>s.id===current));
}

function renderOverview(){
  const total=SECS.reduce((n,s)=>n+s.items.length,0);
  main.innerHTML=`<div class="mk-cta"><div><b>Ready for the real thing?</b><br><span>Take a timed mock test in the Versant format and get a score on the 20–80 scale.</span></div><button class="primary" data-go="mock">Take a mock test</button></div><h2>All sections in one place</h2>
  <p class="tip">${total} practice items across six sections, with duplicates removed and answers checked. Pick a section to start. Your progress is saved in this browser.</p>
  <div class="grid">${SECS.map(sec=>{ const c=counts(sec); return `<div class="tilecard"><span class="skill">${sec.skill}</span><h3 style="margin:0">${sec.name}</h3>
    <p>${c.total} items, ${c.ok} correct, ${c.bad} wrong</p>
    <div class="mini"><span class="p-ok" style="width:${c.ok/c.total*100}%"></span><span class="p-bad" style="width:${c.bad/c.total*100}%"></span></div>
    <button class="primary" data-go="${sec.id}">${c.ok+c.bad?"Continue":"Start"}</button></div>`; }).join("")}</div>
  <div class="note"><h3>What was cleaned up</h3><ul>
    <li>Repeats: 330 unique sentences after merging Tests 1–10 with the practice list. Exact and near-duplicates were removed, and sentences that were garbled in the source and couldn’t be confirmed were dropped.</li>
    <li>Sentence Builds: 110 items. Five duplicates or unclear items were removed, and phrases that didn’t add up to the answer were fixed (for example, “were sold” → “was sold”, “someone to leave” → “someone to lead”).</li>
    <li>Conversations: 36 unique items from four overlapping lists. One wrong answer was corrected: the shirt question’s answer is the fabric, not the colour.</li>
    <li>Sentence Completion: 144 unique blanks (unchanged from your earlier sheet).</li>
    <li>Dictation: 78 sentences. One duplicate and one garbled line were removed, and two lines were corrected.</li>
    <li>Passage Reconstruction: 37 passages. Model answers were rewritten to keep every key event and its order.</li>
  </ul></div>
  <p class="hint" style="margin-top:14px">Audio uses your browser’s built-in voice. Speaking checks need Chrome or Edge with microphone access; if it isn’t available, mark yourself instead.</p>`;
  main.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
}

function renderSection(sec){
  const s=S(sec);
  const view=s.wrongOnly?s.order.filter(i=>s.res[i]==="bad"):s.order;
  if(s.pos>=view.length)s.pos=Math.max(0,view.length-1);
  const c=counts(sec);
  main.innerHTML=`<h2>${sec.name}</h2><p class="tip">${sec.tip}</p>
  <div class="stats"><span class="ok"><b>${c.ok}</b> correct</span><span class="bad"><b>${c.bad}</b> wrong</span><span><b>${c.left}</b> not tried</span><span><b>${c.ok+c.bad?Math.round(c.ok/(c.ok+c.bad)*100)+"%":"–"}</b> score</span></div>
  <div class="progress"><span class="p-ok" style="width:${c.ok/c.total*100}%"></span><span class="p-bad" style="width:${c.bad/c.total*100}%"></span></div>
  <div class="tools"><button data-a="wrong">${s.wrongOnly?"Show all questions":"Practise wrong ones only"}</button><button data-a="shuffle">Shuffle order</button><button data-a="reset">Start this section over</button></div>
  <div class="card" id="card"></div>
  <div class="nav"><button data-a="prev">Previous</button><button class="primary" data-a="next">Next</button>
  <label class="speed">Go to <select id="jump"></select></label></div>`;
  const card=main.querySelector("#card");
  main.querySelector('[data-a="wrong"]').onclick=()=>{ s.wrongOnly=!s.wrongOnly; s.pos=0; save(); render(); };
  main.querySelector('[data-a="shuffle"]').onclick=()=>{ const a=s.order; for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]} s.pos=0; save(); render(); };
  main.querySelector('[data-a="reset"]').onclick=()=>{ if(!confirm(`Clear all your answers in ${sec.name}?`))return; delete ST[sec.id]; save(); render(); };
  if(!view.length){ card.innerHTML=`<div class="empty">${s.wrongOnly?"No wrong answers to practise. Choose “Show all questions” to keep going.":"No questions here."}</div>`; main.querySelector('.nav').classList.add("hidden"); return; }
  const jump=main.querySelector("#jump");
  jump.innerHTML=view.map((_,n)=>`<option value="${n}" ${n===s.pos?"selected":""}>${n+1}</option>`).join("");
  jump.onchange=()=>{ s.pos=+jump.value; save(); render(); };
  const prev=main.querySelector('[data-a="prev"]'), next=main.querySelector('[data-a="next"]');
  prev.disabled=s.pos===0; next.disabled=s.pos>=view.length-1;
  const nextFn=()=>{ if(s.pos<view.length-1){ s.pos++; save(); render(); } };
  prev.onclick=()=>{ s.pos--; save(); render(); };
  next.onclick=nextFn;
  const i=view[s.pos];
  card.innerHTML=`<div class="cardtop"><span>Question ${s.pos+1} of ${view.length}</span><span class="badge ${s.res[i]||""}" id="badge">${s.res[i]==="ok"?"Correct":s.res[i]==="bad"?"Wrong":""}</span></div><div id="body"></div>`;
  const api={res:s.res[i],ans:s.ans[i],next:nextFn,
    mark(r,ans){ s.res[i]=r; if(ans!==undefined)s.ans[i]=ans; api.res=r; save(); const b=card.querySelector("#badge"); b.className="badge "+r; b.textContent=r==="ok"?"Correct":"Wrong"; refreshStats(sec); }};
  R[sec.id](i,card.querySelector("#body"),api);
  const first=card.querySelector("input,textarea"); if(first&&!api.res&&sec.id!=="pass"&&sec.id!=="repeat") first.focus({preventScroll:true});
}

function refreshStats(sec){
  const c=counts(sec);
  const st=main.querySelector(".stats"); if(!st)return;
  st.innerHTML=`<span class="ok"><b>${c.ok}</b> correct</span><span class="bad"><b>${c.bad}</b> wrong</span><span><b>${c.left}</b> not tried</span><span><b>${c.ok+c.bad?Math.round(c.ok/(c.ok+c.bad)*100)+"%":"–"}</b> score</span>`;
  const p=main.querySelector(".progress"); p.children[0].style.width=c.ok/c.total*100+"%"; p.children[1].style.width=c.bad/c.total*100+"%";
}

function renderKey(){
  main.innerHTML=`<div class="key"><h2>Answer key</h2>
  <p class="tip">Every item from all six sections on one sheet, with answers. Use it for revision or print it.</p>
  <button class="noprint" id="print">Print this sheet</button>
  <h3>Repeat (${REPEAT.length})</h3><ol>${REPEAT.map(t=>`<li>${esc(t)}</li>`).join("")}</ol>
  <h3>Sentence Builds (${BUILDS.length})</h3><ol>${BUILDS.map(([c,a])=>`<li><span class="sub">${c.map(esc).join(" / ")}</span><br><span class="a">${esc(a.join("  or  "))}</span></li>`).join("")}</ol>
  <h3>Conversations (${CONV.length})</h3><ol>${CONV.map(c=>`<li><span class="sub">${c.l.map(esc).join(" — ")}</span><br>${esc(c.q)} <span class="a">${esc(c.a)}</span></li>`).join("")}</ol>
  <h3>Sentence Completion (${FIB.length})</h3><ol>${FIB.map(([s,a])=>`<li>${esc(s).replace("___",`<span class="a">${esc(a[0])}</span>`)}${a.length>1?` <span class="sub">(also: ${esc(a.slice(1).join(", "))})</span>`:""}</li>`).join("")}</ol>
  <h3>Dictation (${DICT.length})</h3><ol>${DICT.map(t=>`<li>${esc(t)}</li>`).join("")}</ol>
  <h3>Passage Reconstruction (${PASS.length})</h3><ol>${PASS.map(p=>`<li><b>${esc(p.t)}</b><br><span class="sub">Original:</span> ${esc(p.p)}<br><span class="sub">Model answer:</span> <span class="a" style="font-weight:400">${esc(p.m)}</span></li>`).join("")}</ol></div>`;
  main.querySelector("#print").onclick=()=>window.print();
}

drawTabs(); render();
</script>
<script>
/* ================= Mock test (Versant 4 Skills Essential format) ================= */
const MK_BLUEPRINT=[
 {id:"repeat",letter:"A",name:"Repeat",full:16,short:8,how:"speak",
  ins:"You will hear a sentence once. Repeat it exactly as you heard it. Start speaking as soon as the beep-light turns red.",time:"About 15 seconds to answer"},
 {id:"builds",letter:"B",name:"Sentence Builds",full:10,short:5,how:"speak",
  ins:"You will hear three short phrases in a mixed-up order. Put them in an order that makes a sentence and say the sentence.",time:"About 15 seconds to answer"},
 {id:"conv",letter:"C",name:"Conversations",full:12,short:6,how:"speak",
  ins:"You will hear a short conversation between two people, then a question. Answer the question in a word or a short phrase.",time:"10 seconds to answer"},
 {id:"fib",letter:"D",name:"Sentence Completion",full:20,short:10,how:"type",
  ins:"Read the sentence and type one word that fits the blank. Press Enter to move on.",time:"25 seconds per sentence"},
 {id:"dict",letter:"E",name:"Dictation",full:16,short:8,how:"type",
  ins:"You will hear a sentence once. Type it exactly as you hear it. Spelling and small words count. Press Enter to move on.",time:"25 seconds per sentence"},
 {id:"pass",letter:"F",name:"Passage Reconstruction",full:3,short:2,how:"type",
  ins:"Read a short passage for 30 seconds. It then disappears and you have 90 seconds to rewrite it in your own words, keeping the meaning.",time:"30 s reading, 90 s writing"}
];
const MK_POOL={repeat:REPEAT,builds:BUILDS,conv:CONV,fib:FIB,dict:DICT,pass:PASS};
const MK_HIST="versant-mock-history", MK_USED="versant-mock-used";
const mkLoad=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||"null")??d}catch(e){return d}};
const mkSave=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* Versant reports 20–80. Raw proportion → scale (monotone, steeper in the middle like an IRT curve). */
const MK_PTS=[[0,20],[.2,26],[.4,36],[.6,47],[.75,58],[.9,69],[.98,79],[1,80]];
function mkScale(p){ p=Math.max(0,Math.min(1,p)); for(let k=1;k<MK_PTS.length;k++){ const [x1,y1]=MK_PTS[k-1],[x2,y2]=MK_PTS[k]; if(p<=x2) return Math.round(y1+(p-x1)/(x2-x1)*(y2-y1)); } return 80; }
const MK_BANDS=[[79,"C2"],[69,"C1"],[58,"B2"],[47,"B1"],[36,"A2"],[26,"A1"],[0,"Below A1"]];
const mkCefr=s=>MK_BANDS.find(([m])=>s>=m)[1];
const clamp=x=>Math.max(0,Math.min(1,x));
const avg=a=>{a=a.filter(x=>typeof x==="number"&&!isNaN(x)); return a.length?a.reduce((s,x)=>s+x,0)/a.length:null};

/* ---------- item scoring ---------- */
function mkErrors(exp,got){ const d=diff(exp,got); return {d,err:d.filter(x=>x[0]!=="same").length,hit:d.filter(x=>x[0]==="same").length}; }
// Versant scores Repeats, Builds and Dictation by the number of word errors.
const mkErrScore=(err,n)=>clamp(1-err/Math.max(4,Math.ceil(n/2)));
function mkFluency(r,nSaid){ if(!nSaid||r.latency==null) return 0;
  const lat=clamp((3.5-r.latency)/2.5);              // starts within ~1 s → full marks
  const wps=nSaid/Math.max(.6,r.dur);                 // natural pace ≈ 2.4+ words per second
  return .4*lat+.6*clamp((wps-1)/1.4); }
function mkPron(r,acc){ const c=r.conf&&r.conf>0?clamp((r.conf-.55)/.4):null; return c==null?acc:.5*c+.5*acc; }
function mkPassage(p,text){
  const kw=[...new Set(words(p.p).filter(w=>!STOP.has(w)&&w.length>2))], uw=words(text);
  const stem=w=>w.slice(0,5);
  const pos=[]; kw.forEach((w,k)=>{ const j=uw.findIndex(u=>u===w||(u.length>=5&&w.length>=5&&stem(u)===stem(w))); if(j>=0)pos.push([k,j]); });
  const cov=kw.length?pos.length/kw.length:0;
  // order: longest increasing run of the keywords the writer kept
  const seq=pos.sort((a,b)=>a[1]-b[1]).map(x=>x[0]), L=[]; seq.forEach(v=>{ let lo=0,hi=L.length; while(lo<hi){const m=(lo+hi)>>1; L[m]<v?lo=m+1:hi=m;} L[lo]=v; });
  const order=seq.length?L.length/seq.length:0;
  const sents=text.split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(Boolean);
  const caps=sents.length?sents.filter(s=>/^[A-Z"“]/.test(s)).length/sents.length:0;
  const ends=/[.!?]["”]?\s*$/.test(text.trim())?1:0;
  const lenR=uw.length/Math.max(1,words(p.p).length), len=lenR>=.6&&lenR<=1.4?1:clamp(1-Math.abs(lenR<.6?.6-lenR:lenR-1.4)*2);
  const mech=uw.length?(caps*.4+ends*.2+len*.4):0;
  return {score:clamp(.7*clamp(cov/.85)+.15*order+.15*mech),cov,order,mech};
}

/* ---------- audio ---------- */
function mkSay(parts,done){
  if(!hasTTS){ done(); return; }
  speechSynthesis.cancel(); let k=0;
  const next=()=>{ if(T.dead)return; if(k>=parts.length){ later(done,250); return; }
    const p=parts[k++], u=new SpeechSynthesisUtterance(p.t), v=voiceFor(p.v||0);
    if(v){u.voice=v;u.lang=v.lang}else u.lang="en-US"; u.rate=parseFloat(rateSel.value);
    let fired=false; const fin=()=>{ if(fired)return; fired=true; later(next,k>=parts.length?0:(p.gap||650)); };
    u.onend=fin; u.onerror=fin; later(fin,2500+p.t.length*130/u.rate); speechSynthesis.speak(u); };
  later(next,150);
}
function mkListen(opt,cb){
  let r; try{ r=new SR(); }catch(e){ cb({text:"",err:"start"}); return; }
  r.lang="en-US"; r.interimResults=true; r.continuous=false; r.maxAlternatives=1;
  const t0=performance.now(); let tFirst=null,tLast=null,text="",conf=null,err=null,ended=false;
  const fin=()=>{ if(ended)return; ended=true; T.rec=null;
    cb({text:text.trim(),conf,err,latency:tFirst==null?null:(tFirst-t0)/1000,dur:tFirst==null?0:Math.max(0,(tLast-tFirst)/1000)}); };
  r.onspeechstart=()=>{ if(tFirst==null)tFirst=performance.now(); };
  r.onresult=e=>{ const now=performance.now(); if(tFirst==null)tFirst=now; tLast=now; let t="",c=[];
    for(const res of e.results){ t+=res[0].transcript; if(res.isFinal&&res[0].confidence)c.push(res[0].confidence); }
    text=t; if(c.length)conf=avg(c); opt.onText&&opt.onText(t); };
  r.onerror=e=>{ err=e.error; };
  r.onend=fin;
  later(()=>{ if(tFirst==null&&!ended){ try{r.abort()}catch(e){} fin(); } },opt.silence||6000);
  later(()=>{ if(!ended){ try{r.stop()}catch(e){} later(fin,1200); } },opt.max||15000);
  T.rec=r; try{ r.start(); }catch(e){ err="start"; fin(); }
}

/* ---------- test state ---------- */
let T={dead:true,timers:[]};
function later(fn,ms){ const id=setTimeout(()=>{ if(!T.dead)fn(); },ms); T.timers.push(id); return id; }
function every(fn,ms){ const id=setInterval(()=>{ if(T.dead)clearInterval(id); else fn(); },ms); T.timers.push(id); return id; }
function clearTimers(){ T.timers.forEach(id=>{clearTimeout(id);clearInterval(id)}); T.timers=[]; }
function mockAbort(){ if(T.dead)return; T.dead=true; clearTimers(); try{T.rec&&T.rec.abort()}catch(e){} if(hasTTS)speechSynthesis.cancel(); document.body.classList.remove("intest"); }
window.mockAbort=mockAbort;
let mkMic=null; // null = not checked, true = working, false = not available
let mkView={len:"full",report:null,quit:false};

function mkPick(sec,n){
  const used=mkLoad(MK_USED,{}), pool=MK_POOL[sec].map((_,i)=>i), u=new Set(used[sec]||[]);
  let fresh=pool.filter(i=>!u.has(i)); if(fresh.length<n){ fresh=pool; used[sec]=[]; }
  for(let k=fresh.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [fresh[k],fresh[j]]=[fresh[j],fresh[k]]; }
  const out=fresh.slice(0,n); used[sec]=[...(used[sec]||[]),...out]; mkSave(MK_USED,used); return out;
}

/* ---------- home ---------- */
function renderMock(){
  if(mkView.report) return mkReport(mkView.report);
  const hist=mkLoad(MK_HIST,[]);
  const n=k=>MK_BLUEPRINT.reduce((s,p)=>s+p[k],0);
  main.innerHTML=`<h2>Mock test</h2>
  <p class="tip">A timed test in the Versant English (4 skills) format. Audio plays once, you can’t go back, and each question moves on by itself when time runs out. You get a score report at the end.</p>
  ${mkView.quit?`<div class="fb bad">Test stopped. Nothing was scored.</div>`:""}
  <div class="card">
    <h3>1. Choose the length</h3>
    <div class="mk-opts">
      <label class="mk-opt"><input type="radio" name="mklen" id="mklen-full" value="full" ${mkView.len==="full"?"checked":""}><span><b>Full test</b><small>${n("full")} questions, about 30 minutes</small></span></label>
      <label class="mk-opt"><input type="radio" name="mklen" id="mklen-short" value="short" ${mkView.len==="short"?"checked":""}><span><b>Short test</b><small>${n("short")} questions, about 15 minutes</small></span></label>
    </div>
    <h3 style="margin-top:16px">2. Check your microphone</h3>
    <p class="hint">Parts A to C are spoken. Use Chrome or Edge, allow the microphone, and wear headphones so the app doesn’t hear its own voice.</p>
    <div class="mk-mic"><button id="mkMicBtn" ${SR?"":"disabled"}>Test microphone</button><span id="mkMicState">${!SR?`<span class="pill bad">This browser can’t recognise speech</span>`:mkMic===true?`<span class="pill ok">Microphone working</span>`:mkMic===false?`<span class="pill bad">Microphone not working</span>`:`<span class="pill">Not tested yet</span>`}</span></div>
    <p class="heard" id="mkHeard"></p>
    <p class="hint" id="mkNoMic" ${mkMic===true?"hidden":""}>Without a working microphone, Parts A–C are answered by typing and you won’t get a Speaking score.</p>
    <div class="btns" style="margin-top:14px"><button class="primary" id="mkStart">Start the test</button></div>
  </div>
  <h3 style="margin-top:22px">What’s in the test</h3>
  <div class="tblwrap"><table class="mk-table"><thead><tr><th>Part</th><th>Task</th><th>Questions</th><th>Time</th><th>Skills scored</th></tr></thead><tbody>
  ${MK_BLUEPRINT.map(p=>`<tr><td class="n">${p.letter}</td><td>${p.name}</td><td class="n">${p.full} <span class="sub" style="color:var(--muted)">(short ${p.short})</span></td><td>${p.time}</td><td>${({repeat:"Speaking, Listening",builds:"Speaking, Listening",conv:"Speaking, Listening",fib:"Reading, Writing",dict:"Listening, Writing",pass:"Reading, Writing"})[p.id]}</td></tr>`).join("")}
  </tbody></table></div>
  ${hist.length?`<h3 style="margin-top:22px">Your past tests</h3><div class="hist">${hist.map((h,k)=>`<button data-h="${k}"><span>${new Date(h.date).toLocaleString([], {dateStyle:"medium",timeStyle:"short"})} · ${h.len==="full"?"Full":"Short"} test</span><span><b>${h.scores.overall}</b> / 80 · ${mkCefr(h.scores.overall)}</span></button>`).join("")}</div>`:""}
  <div class="note"><h3>How the score is worked out</h3>
  <p style="margin:6px 0 0">Pearson’s real scoring uses its own trained speech models and isn’t public, so no app can copy it exactly. This one uses the same format, timing and 20–80 scale, and scores the same things Versant looks at: how many words you get right in Repeats, Builds and Dictation; whether your Conversation and Sentence Completion answers are right; how much of the passage you keep, in the right order; and, for speaking, how quickly and smoothly you answer (fluency) and how clearly the recogniser understood you (pronunciation). Treat the result as a close estimate.</p></div>`;
  mkView.quit=false;
  main.querySelectorAll('input[name="mklen"]').forEach(r=>r.onchange=()=>mkView.len=r.value);
  main.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{ mkView.report=hist[+b.dataset.h]; render(); window.scrollTo(0,0); });
  const micBtn=main.querySelector("#mkMicBtn");
  if(SR) micBtn.onclick=()=>{
    T={dead:false,timers:[]};
    const st=main.querySelector("#mkMicState"), heard=main.querySelector("#mkHeard");
    st.innerHTML=`<span class="mk-status"><span class="dot speak"></span>Say: “I am ready to take my test.”</span>`; heard.textContent=""; micBtn.disabled=true;
    mkListen({silence:7000,max:9000,onText:t=>heard.textContent="Heard: "+t},r=>{
      T.dead=true; clearTimers(); micBtn.disabled=false;
      mkMic=!!r.text; st.innerHTML=mkMic?`<span class="pill ok">Microphone working</span>`:`<span class="pill bad">${r.err==="not-allowed"||r.err==="service-not-allowed"?"Microphone blocked. Allow it in the address bar and try again":"Nothing was heard. Try again"}</span>`;
      heard.textContent=r.text?"Heard: "+r.text:""; const nm=main.querySelector("#mkNoMic"); if(nm)nm.hidden=mkMic;
    });
  };
  main.querySelector("#mkStart").onclick=()=>mkBegin(mkView.len);
}

/* ---------- running the test ---------- */
function mkBegin(len){
  T={dead:false,timers:[],len,mic:mkMic===true&&!!SR,parts:MK_BLUEPRINT.map(p=>({...p,items:mkPick(p.id,p[len])})),pi:0,ii:0,res:[]};
  document.body.classList.add("intest"); window.scrollTo(0,0); mkIntro();
}
function mkShell(inner){
  const p=T.parts[T.pi];
  main.innerHTML=`<div class="mk-head"><span class="mk-part">Part ${p.letter} · ${p.name}</span><button id="mkQuit">Stop test</button></div><div class="card">${inner}</div>`;
  const q=main.querySelector("#mkQuit");
  q.onclick=()=>{ if(q.dataset.sure){ mockAbort(); mkView.quit=true; render(); return; } q.dataset.sure=1; q.textContent="Click again to stop. Your answers will be lost"; setTimeout(()=>{ if(q.isConnected){ delete q.dataset.sure; q.textContent="Stop test"; } },4000); };
  return main.querySelector(".card");
}
function mkIntro(){
  const p=T.parts[T.pi], typedSpeak=p.how==="speak"&&!T.mic;
  const c=mkShell(`<h2>Part ${p.letter}: ${p.name}</h2><p class="tip">${p.ins}</p>
  ${typedSpeak?`<p class="hint">No microphone: ${p.id==="builds"?"tap the phrases in order instead of speaking.":"type your answer instead of speaking."}</p>`:""}
  <p class="hint">${p.items.length} questions · ${p.time}</p><div class="btns"><button class="primary" id="mkGo">Start Part ${p.letter}</button></div>`);
  c.querySelector("#mkGo").onclick=()=>{ T.ii=0; mkItem(); };
  c.querySelector("#mkGo").focus();
}
function mkStage(html){
  const p=T.parts[T.pi];
  return mkShell(`<div class="cardtop"><span>Question ${T.ii+1} of ${p.items.length}</span><span>Part ${T.pi+1} of ${T.parts.length}</span></div><div class="mk-stage">${html}</div>`);
}
const mkStatus=(c,cls,t)=>{ c.querySelector("[data-st]").innerHTML=`<span class="dot ${cls}"></span>${t}`; };
function mkCountdown(c,secs,onEnd){
  const bar=c.querySelector("[data-cd]"), txt=c.querySelector("[data-cdt]"); let t=secs;
  const draw=()=>{ if(bar)bar.style.width=(t/secs*100)+"%"; if(txt)txt.textContent=`${t} s left`; };
  draw(); every(()=>{ t--; draw(); if(t<=0){ clearTimers(); onEnd(); } },1000);
}
const CD=`<div class="cd"><span data-cd style="width:100%"></span></div><div class="cdtxt" data-cdt></div>`;

function mkDone(r){
  const p=T.parts[T.pi]; clearTimers(); try{T.rec&&T.rec.abort()}catch(e){}
  T.res.push({sec:p.id,i:p.items[T.ii],...r});
  if(T.ii<p.items.length-1){ T.ii++; later(mkItem,700); }
  else if(T.pi<T.parts.length-1){ T.pi++; later(mkIntro,500); }
  else later(mkFinish,400);
}
function mkItem(){ const p=T.parts[T.pi]; MK_RUN[p.id](p.items[T.ii]); }

/* spoken answer helper used by A–C */
function mkSpoken(c,opt,score){
  mkStatus(c,"speak","Speak now"); const heard=c.querySelector(".heard");
  mkListen({silence:opt.silence||6000,max:opt.max||15000,onText:t=>heard.textContent=t},r=>{
    if(T.dead)return;
    if(r.err==="not-allowed"||r.err==="service-not-allowed"){ T.mic=false; }
    mkStatus(c,"","Saved"); mkDone({said:r.text,mode:"voice",...score(r)});
  });
}
/* typed answer helper */
function mkTyped(c,secs,score,opt={}){
  const inp=c.querySelector("[data-in]"); let sent=false;
  const send=()=>{ if(sent)return; sent=true; mkDone({said:inp.value.trim(),mode:"typed",...score(inp.value)}); };
  inp.disabled=false; inp.focus({preventScroll:true});
  if(!opt.multiline) inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); send(); } };
  const b=c.querySelector("[data-send]"); if(b)b.onclick=send;
  mkCountdown(c,secs,send);
}
const NOTTS_SHOW=(c,text,next)=>{ const el=c.querySelector("[data-noaudio]"); if(!hasTTS&&el){ el.textContent=text; el.hidden=false; later(()=>{ el.hidden=true; next(); },Math.max(3000,text.length*70)); return true; } return false; };

const MK_RUN={
 repeat(i){
  const txt=REPEAT[i], exp=words(txt);
  const c=mkStage(`<div class="mk-status" data-st></div><p class="serif" data-noaudio hidden></p>${T.mic?`<p class="heard"></p>`:`<input class="textin" data-in disabled type="text" autocomplete="off" spellcheck="false" placeholder="Type the sentence you heard">${CD}`}`);
  mkStatus(c,"listen","Listen");
  const go=()=>{
    if(T.mic) mkSpoken(c,{},r=>{ const g=words(r.text),{err,hit}=mkErrors(exp,g); const acc=hit/exp.length; return {score:mkErrScore(err,exp.length),flu:mkFluency(r,g.length),pro:r.text?mkPron(r,acc):0}; });
    else { mkStatus(c,"","Type what you heard"); mkTyped(c,20,v=>({score:mkErrScore(mkErrors(exp,words(v)).err,exp.length)})); }
  };
  if(!NOTTS_SHOW(c,txt,go)) mkSay([{t:txt}],go);
 },
 builds(i){
  const [chunks,answers]=BUILDS[i];
  const best=g=>answers.map(a=>{ const e=words(a); return {e,...mkErrors(e,g)}; }).sort((x,y)=>x.err-y.err)[0];
  const c=mkStage(`<div class="mk-status" data-st></div><p class="serif" data-noaudio hidden></p>${T.mic?`<p class="heard"></p>`:`<div class="line" data-line></div><div class="pool" data-pool></div><div class="btns"><button class="primary" data-send>Submit</button><button data-clear>Clear</button></div>${CD}`}`);
  mkStatus(c,"listen","Listen");
  const go=()=>{
    if(T.mic) return mkSpoken(c,{},r=>{ const g=words(r.text),b=best(g); return {score:mkErrScore(b.err,b.e.length),flu:mkFluency(r,g.length),pro:r.text?mkPron(r,b.hit/b.e.length):0}; });
    mkStatus(c,"","Tap the phrases in order");
    let picked=[],sent=false; const line=c.querySelector("[data-line]"),pool=c.querySelector("[data-pool]");
    const draw=()=>{ line.innerHTML="";pool.innerHTML="";
      picked.forEach((k,pi)=>{const b=document.createElement("button");b.className="tile";b.textContent=chunks[k];b.onclick=()=>{picked.splice(pi,1);draw()};line.append(b);});
      chunks.forEach((t,k)=>{ if(picked.includes(k))return; const b=document.createElement("button");b.className="tile";b.textContent=t;b.onclick=()=>{picked.push(k);draw()};pool.append(b);}); };
    draw();
    const send=()=>{ if(sent)return; sent=true; const said=picked.map(k=>chunks[k]).join(" "); const b=best(words(said)); mkDone({said,mode:"typed",score:picked.length===chunks.length&&b.err===0?1:0}); };
    c.querySelector("[data-send]").onclick=send; c.querySelector("[data-clear]").onclick=()=>{picked=[];draw()};
    mkCountdown(c,20,send);
  };
  if(!NOTTS_SHOW(c,chunks.join("  …  "),go)) mkSay(chunks.map(t=>({t,gap:550})),go);
 },
 conv(i){
  const cv=CONV[i];
  const right=v=>{ const w=words(v); return w.length&&cv.k.every(g=>g.some(k=>w.some(x=>x.startsWith(k))))?1:0; };
  const c=mkStage(`<div class="mk-status" data-st></div><p class="serif" data-noaudio hidden></p>${T.mic?`<p class="heard"></p>`:`<input class="textin" data-in disabled type="text" autocomplete="off" placeholder="Type a short answer">${CD}`}`);
  mkStatus(c,"listen","Listen to the conversation and the question");
  const go=()=>{
    if(T.mic) mkSpoken(c,{max:10000},r=>({score:right(r.text)}));
    else { mkStatus(c,"","Type your answer"); mkTyped(c,15,v=>({score:right(v)})); }
  };
  const all=[...cv.l,"Question: "+cv.q].join("  ");
  if(!NOTTS_SHOW(c,all,go)) mkSay([...cv.l.map((t,n)=>({t,v:n%2})),{t:cv.q,v:0,gap:900}],go);
 },
 fib(i){
  const [s,acc]=FIB[i], parts=s.split("___");
  const c=mkStage(`<div class="mk-status" data-st></div><p class="serif">${esc(parts[0])}<input class="blank" data-in type="text" autocomplete="off" spellcheck="false" autocapitalize="off" aria-label="Missing word">${esc(parts[1]||"")}</p>${CD}`);
  mkStatus(c,"","Type the missing word, then press Enter");
  mkTyped(c,25,v=>({score:acc.some(a=>same(a,v))?1:0}));
 },
 dict(i){
  const txt=DICT[i], exp=words(txt);
  const c=mkStage(`<div class="mk-status" data-st></div><p class="serif" data-noaudio hidden></p><input class="textin" data-in disabled type="text" autocomplete="off" spellcheck="false" placeholder="Type exactly what you hear">${CD}`);
  mkStatus(c,"listen","Listen");
  const go=()=>{ mkStatus(c,"","Type the sentence, then press Enter"); mkTyped(c,25,v=>({score:mkErrScore(mkErrors(exp,words(v)).err,exp.length)})); };
  if(!NOTTS_SHOW(c,txt,go)) mkSay([{t:txt}],go);
 },
 pass(i){
  const p=PASS[i];
  const c=mkStage(`<div class="mk-status" data-st></div><div data-ph1><div class="passage serif">${esc(p.p)}</div></div><div data-ph2 hidden><textarea class="textin" data-in disabled placeholder="Rewrite the passage in your own words"></textarea><div class="btns" style="margin-top:8px"><button class="primary" data-send>Submit</button></div></div>${CD}`);
  mkStatus(c,"listen","Read the passage");
  mkCountdown(c,30,()=>{
    c.querySelector("[data-ph1]").hidden=true; c.querySelector("[data-ph2]").hidden=false;
    mkStatus(c,"","Rewrite the passage");
    mkTyped(c,90,v=>{ const r=mkPassage(p,v); return {score:r.score,detail:{cov:r.cov,order:r.order,mech:r.mech}}; },{multiline:true});
  });
 }
};

/* ---------- scoring the whole test ---------- */
function mkCompute(res,mic){
  const part={}; MK_BLUEPRINT.forEach(p=>part[p.id]=avg(res.filter(r=>r.sec===p.id).map(r=>r.score))??0);
  const spoken=res.filter(r=>r.mode==="voice"&&(r.sec==="repeat"||r.sec==="builds"));
  const flu=avg(spoken.map(r=>r.flu)), pro=avg(spoken.map(r=>r.pro));
  const voiceUsed=mic&&spoken.length>0;
  const speakContent=avg([part.repeat,part.builds,part.conv]);
  const raw={
    speaking:voiceUsed?.4*speakContent+.3*(flu??0)+.3*(pro??0):null,
    listening:avg([part.repeat,part.builds,part.conv,part.dict]),
    reading:(2*part.fib+part.pass)/3,
    writing:(part.fib+part.dict+2*part.pass)/4
  };
  const sc={}; Object.entries(raw).forEach(([k,v])=>sc[k]=v==null?null:mkScale(v));
  const present=Object.values(sc).filter(v=>v!=null);
  sc.overall=Math.round(present.reduce((a,b)=>a+b,0)/present.length);
  sc.fluency=voiceUsed?mkScale(flu??0):null; sc.pronunciation=voiceUsed?mkScale(pro??0):null;
  sc.part=Object.fromEntries(Object.entries(part).map(([k,v])=>[k,Math.round(v*100)]));
  return sc;
}
function mkFinish(){
  const att={date:Date.now(),len:T.len,mic:T.mic,res:T.res};
  att.scores=mkCompute(att.res,att.mic);
  const hist=mkLoad(MK_HIST,[]); hist.unshift(att); mkSave(MK_HIST,hist.slice(0,10));
  mockAbort(); mkView.report=att; render(); window.scrollTo(0,0);
}

/* ---------- report ---------- */
function mkBar(name,score){
  if(score==null) return `<div class="skill"><span class="nm">${name}</span><span class="hint" style="margin:0">Not scored (no microphone)</span><span></span></div>`;
  const pct=x=>(x-20)/60*100;
  return `<div class="skill"><span class="nm">${name}</span><div class="track" role="img" aria-label="${name} ${score} out of 80"><div class="fill" style="width:${pct(score)}%"></div>${[26,36,47,58,69,79].map(t=>`<span class="tk" style="left:${pct(t)}%"></span>`).join("")}</div><span class="sc">${score}</span></div>`;
}
function mkReviewItem(r){
  const pct=Math.round(r.score*100), said=r.said?esc(r.said):`<i>No response</i>`;
  const tag=`<span class="pill ${pct>=80?"ok":pct<50?"bad":""}">${pct}%</span>`;
  if(r.sec==="repeat"||r.sec==="dict"){ const t=MK_POOL[r.sec][r.i];
    return `<div class="ritem">${tag} <span class="q">${esc(t)}</span><span class="you">${r.said?diffHTML(diff(words(t),words(r.said))):said}</span></div>`; }
  if(r.sec==="builds"){ const [ch,a]=BUILDS[r.i]; return `<div class="ritem">${tag} <span class="q">${ch.map(esc).join(" / ")} → ${esc(a[0])}</span><span class="you">You said: ${said}</span></div>`; }
  if(r.sec==="conv"){ const c=CONV[r.i]; return `<div class="ritem">${tag} <span class="q">${esc(c.q)} Answer: ${esc(c.a)}</span><span class="you">You said: ${said}</span></div>`; }
  if(r.sec==="fib"){ const [s,a]=FIB[r.i]; return `<div class="ritem">${tag} <span class="q">${esc(s).replace("___",`<b>${esc(a.join(" / "))}</b>`)}</span><span class="you">You wrote: ${said}</span></div>`; }
  const p=PASS[r.i], d=r.detail||{cov:0,order:0,mech:0};
  return `<div class="ritem">${tag} <b>${esc(p.t)}</b> <span class="q">· key ideas kept ${Math.round(d.cov*100)}%, order ${Math.round(d.order*100)}%, sentence form ${Math.round(d.mech*100)}%</span>
    <div class="compare"><div><small>Your answer</small>${said}</div><div><small>Model answer</small>${esc(p.m)}</div></div></div>`;
}
function mkReport(att){
  const s=att.scores, silent=att.res.filter(r=>!r.said).length, total=att.res.length;
  main.innerHTML=`<div class="mk-head"><h2 style="margin:0">Score report</h2><span class="hint" style="margin:0">${new Date(att.date).toLocaleString([], {dateStyle:"medium",timeStyle:"short"})} · ${att.len==="full"?"Full":"Short"} test</span></div>
  ${silent/total>.4?`<div class="fb bad">You didn’t answer ${silent} of ${total} questions. The real test may not report a score when this many answers are missing.</div>`:""}
  <div class="card"><div class="mk-overall"><div class="mk-big">${s.overall}<small> / 80</small></div>
  <div><div class="mk-cefr">CEFR ${mkCefr(s.overall)}</div><p class="hint" style="margin:4px 0 0">Overall score on the Versant 20–80 scale. It is the average of the skill scores below.</p></div></div></div>
  <div class="card"><h3>Skill scores</h3>
  ${mkBar("Speaking",s.speaking)}${mkBar("Listening",s.listening)}${mkBar("Reading",s.reading)}${mkBar("Writing",s.writing)}
  <div class="bands" aria-hidden="true">${[["A1",26],["A2",36],["B1",47],["B2",58],["C1",69],["C2",79]].map(([l,v])=>`<span style="left:${(v-20)/60*100}%">${l}</span>`).join("")}</div>
  ${s.fluency!=null?`<div class="mk-traits"><div>Fluency <b>${s.fluency}</b></div><div>Pronunciation <b>${s.pronunciation}</b></div></div><p class="hint" style="margin-top:8px">Fluency comes from how quickly you start and how smoothly you speak. Pronunciation comes from how confidently the speech recogniser understood your words.</p>`:""}</div>
  <div class="card"><h3>By part</h3><div class="tblwrap"><table class="mk-table"><thead><tr><th>Part</th><th>Questions</th><th>Accuracy</th></tr></thead><tbody>
  ${MK_BLUEPRINT.map(p=>`<tr><td>${p.letter}. ${p.name}</td><td class="n">${att.res.filter(r=>r.sec===p.id).length}</td><td class="n">${s.part[p.id]}%</td></tr>`).join("")}</tbody></table></div></div>
  <div class="card"><h3>Your answers</h3><p class="hint">${LEGEND.replace(/<\/?div[^>]*>/g,"")}</p>
  ${MK_BLUEPRINT.map(p=>{ const rs=att.res.filter(r=>r.sec===p.id); return rs.length?`<details class="rev"><summary>${p.letter}. ${p.name} · ${s.part[p.id]}%</summary>${rs.map(mkReviewItem).join("")}</details>`:""; }).join("")}</div>
  <div class="btns"><button class="primary" id="mkAgain">Take another test</button><button id="mkHome">Back to mock test home</button></div>`;
  main.querySelector("#mkAgain").onclick=()=>{ mkView.report=null; mkBegin(att.len); };
  main.querySelector("#mkHome").onclick=()=>{ mkView.report=null; render(); window.scrollTo(0,0); };
}
</script>
